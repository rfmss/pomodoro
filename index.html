        </button>
        <button class="ctrl-btn secondary" id="btn-skip" onclick="skipTimer()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="28" height="28" fill="currentColor"><path d="M208,32a8,8,0,0,0-8,8V116.36L56.36,34.73A16,16,0,0,0,32,48V208a16,16,0,0,0,24.36,13.27L200,139.64V216a8,8,0,0,0,16,0V40A8,8,0,0,0,208,32ZM48,208V48l144,80Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Preset pills -->
    <div class="presets" id="presets"></div>
  </div>

  <!-- LIST SCREEN -->
  <div class="screen" id="screen-list">
    <div class="list-wrap" id="list-wrap"></div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nav-tab on" id="tab-timer" onclick="showTab('timer')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="20" height="20" fill="currentColor"><path d="M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216Zm45.66-125.66a8,8,0,0,1,0,11.32l-40,40a8,8,0,0,1-11.32-11.32l40-40A8,8,0,0,1,173.66,90.34ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z"/></svg>
      timer
    </button>
    <button class="nav-tab" id="tab-list" onclick="showTab('list')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="20" height="20" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      timers
    </button>
  </div>

</div>

<!-- CUSTOM TIMER SHEET -->
<div class="overlay" id="sheet-overlay" onclick="closeSheet()">
  <div class="sheet" onclick="stopProp(event)">
    <div class="sheet-title" id="sheet-title">novo timer</div>
    <div class="field">
      <label>nome</label>
      <input type="text" id="inp-name" placeholder="foco" autocomplete="off" autocorrect="off" autocapitalize="sentences" maxlength="30">
    </div>
    <div class="field">
      <label>minutos</label>
      <input type="number" id="inp-min" placeholder="25" min="1" max="999" autocomplete="off">
    </div>
    <div class="sheet-btns">
      <button class="sbtn primary" onclick="saveTimer()">salvar</button>
      <button class="sbtn ghost" onclick="closeSheet()">cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Standalone detection ──────────────────────────────────────
if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
  document.body.className = 'standalone';
}

// ── Palette fix: match .app bg to chosen color ────────────────
(function() {
  if (window._pal) {
    document.getElementById('app').style.background = window._pal.h;
  }
})();

// ── Constants ─────────────────────────────────────────────────
var CIRC = 2 * Math.PI * 115; // SVG ring circumference
var KEY = 'pomodoro_v1';
var MAX_TIMERS = 3;

// ── State ─────────────────────────────────────────────────────
var timers = [];        // [{id, name, minutes}]
var curIdx = 0;         // index in timers[] currently shown
var totalSec = 0;       // total seconds for current run
var remSec = 0;         // remaining seconds
var running = false;
var interval = null;

// ── Storage ──────────────────────────────────────────────────
function loadTimers() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data && data.timers) return data.timers;
    }
  } catch(e) {}
  return [
    { id: 't1', name: 'foco', minutes: 25 },
    { id: 't2', name: 'longo', minutes: 55 }
  ];
}

function saveTimers() {
  try { localStorage.setItem(KEY, JSON.stringify({ timers: timers })); } catch(e) {}
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,5);
}

// ── Tabs ──────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('screen-timer').className = tab === 'timer' ? 'screen on' : 'screen';
  document.getElementById('screen-list').className  = tab === 'list'  ? 'screen on' : 'screen';
  document.getElementById('tab-timer').className = tab === 'timer' ? 'nav-tab on' : 'nav-tab';
  document.getElementById('tab-list').className  = tab === 'list'  ? 'nav-tab on' : 'nav-tab';
  if (tab === 'list') renderList();
}

// ── Timer logic ───────────────────────────────────────────────
function selectTimer(idx) {
  if (running) { stopTimer(); }
  curIdx = idx;
  var t = timers[idx];
  totalSec = t.minutes * 60;
  remSec = totalSec;
  updateDisplay();
  renderPresets();
}

function toggleTimer() {
  if (running) { pauseTimer(); } else { startTimer(); }
}

function startTimer() {
  if (remSec <= 0) remSec = totalSec;
  running = true;
  document.body.classList.add('is-running');
  document.getElementById('icon-play').style.display = 'none';
  document.getElementById('icon-pause').style.display = '';
  document.getElementById('timer-status').innerHTML = 'rodando';
  interval = setInterval(tick, 1000);
}

function pauseTimer() {
  running = false;
  document.body.classList.remove('is-running');
  clearInterval(interval);
  document.getElementById('icon-play').style.display = '';
  document.getElementById('icon-pause').style.display = 'none';
  document.getElementById('timer-status').innerHTML = 'pausado';
}

function stopTimer() {
  pauseTimer();
}

function resetTimer() {
  stopTimer();
  document.body.classList.remove('is-running');
  remSec = totalSec;
  document.getElementById('timer-status').innerHTML = 'pronto';
  updateDisplay();
}

function skipTimer() {
  stopTimer();
  document.body.classList.remove('is-running');
  remSec = 0;
  updateDisplay();
  toast('fim!');
}

function tick() {
  remSec--;
  if (remSec <= 0) {
    remSec = 0;
    stopTimer();
    updateDisplay();
    toast('fim!');
    try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...').play(); } catch(e) {}
    return;
  }
  updateDisplay();
}

function updateDisplay() {
  var m = Math.floor(remSec / 60);
  var s = remSec % 60;
  var pad = function(n) { return n < 10 ? '0'+n : ''+n; };
  var mStr = pad(m);
  var sStr = pad(s);

  document.getElementById('timer-display').innerHTML = mStr + ':' + sStr;
  
  // Flip clock update
  var fm = document.getElementById('flip-m');
  var fs = document.getElementById('flip-s');
  if (fm) fm.innerHTML = mStr;
  if (fs) fs.innerHTML = sStr;

  // Ring arc
  var pct = totalSec > 0 ? remSec / totalSec : 1;
  var arc = document.getElementById('ring-arc');
  if (arc) {
    arc.style.strokeDasharray = CIRC;
    arc.style.strokeDashoffset = CIRC * (1 - pct);
  }

  // Name label
  var t = timers[curIdx];
  document.getElementById('timer-name').innerHTML = t ? t.name : '';
}

// ── Presets ───────────────────────────────────────────────────
function renderPresets() {
  var wrap = document.getElementById('presets');
  var html = '';
  for (var i = 0; i < timers.length; i++) {
    var t = timers[i];
    var cls = i === curIdx ? 'preset on' : 'preset';
    html += '<button class="' + cls + '" onclick="selectTimer(' + i + ')">' + t.name + ' ' + t.minutes + 'min</button>';
  }
  wrap.innerHTML = html;
}

// ── List screen ───────────────────────────────────────────────
function renderList() {
  var wrap = document.getElementById('list-wrap');
  var html = '';
  for (var i = 0; i < timers.length; i++) {
    var t = timers[i];
    var cls = i === curIdx ? 'list-item on' : 'list-item';
    html += '<div class="' + cls + '">'
      + '<div class="list-name" onclick="selectTimer(' + i + ');showTab(\'timer\')">' + t.name + '</div>'
      + '<div class="list-dur">' + t.minutes + ' min</div>'
      + '<button class="list-del" onclick="deleteTimer(\'' + t.id + '\')">'
      + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="18" height="18" fill="currentColor"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM112,40a8,8,0,0,1,8-8h16a8,8,0,0,1,8,8v8H112Zm80,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>'
      + '</button>'
      + '</div>';
  }
  if (timers.length < MAX_TIMERS) {
    html += '<button class="add-btn" onclick="openSheet()">'
      + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="22" height="22" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>'
      + 'adicionar timer'
      + '</button>';
  }
  wrap.innerHTML = html;
}

function deleteTimer(id) {
  var newTimers = [];
  for (var i = 0; i < timers.length; i++) {
    if (timers[i].id !== id) newTimers.push(timers[i]);
  }
  timers = newTimers;
  if (curIdx >= timers.length) curIdx = timers.length - 1;
  if (curIdx < 0) curIdx = 0;
  saveTimers();
  renderList();
  if (timers.length > 0) selectTimer(curIdx);
  toast('removido');
}

// ── Sheet ─────────────────────────────────────────────────────
function openSheet() {
  if (timers.length >= MAX_TIMERS) { toast('máximo 3 timers'); return; }
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-min').value = '';
  document.getElementById('sheet-overlay').className = 'overlay on';
  setTimeout(function() { document.getElementById('inp-name').focus(); }, 200);
}

function closeSheet() {
  document.getElementById('sheet-overlay').className = 'overlay';
}

function saveTimer() {
  var name = document.getElementById('inp-name').value.trim() || 'timer';
  var min  = parseInt(document.getElementById('inp-min').value, 10);
  if (!min || min < 1) { toast('minutos inválido'); return; }
  if (min > 999) min = 999;
  timers.push({ id: genId(), name: name, minutes: min });
  saveTimers();
  closeSheet();
  renderList();
  toast('timer salvo');
}

function stopProp(e) {
  e.stopPropagation();
}

// ── Toast ─────────────────────────────────────────────────────
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.innerHTML = msg;
  el.className = 'toast on';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = 'toast'; }, 2200);
}

// ── Init ──────────────────────────────────────────────────────
timers = loadTimers();
if (timers.length > 0) {
  selectTimer(0);
} else {
  updateDisplay();
}
renderPresets();
</script>
</body>
</html>
