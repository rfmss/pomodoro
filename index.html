<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cd7b5f">
  <meta name="description" content="Temporizador Pomodoro local, simples e instalável.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-terra.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <title>Pomodoro</title>
</head>
<body>
  <a class="home-link" href="https://rafa.pro.br/" aria-label="Voltar para rafa.pro.br">← rafa.pro.br</a>

  <main class="app" id="app">
    <header class="app-header">
      <p class="eyebrow">temporizador local</p>
      <h1>Pomodoro</h1>
    </header>

    <section class="timer-panel" aria-labelledby="timer-name">
      <div class="timer-visual" aria-hidden="true">
        <img src="tomato.png" alt="" width="280" height="280">
        <div class="progress-mask" id="progress-mask"></div>
      </div>

      <p class="timer-name" id="timer-name">foco</p>
      <time class="timer-display" id="timer-display" datetime="PT25M">25:00</time>
      <p class="timer-status" id="timer-status" aria-live="polite">pronto</p>

      <div class="controls" aria-label="Controles do temporizador">
        <button class="control secondary" id="reset-button" type="button">Reiniciar</button>
        <button class="control primary" id="play-button" type="button" aria-pressed="false">Iniciar</button>
        <button class="control secondary" id="finish-button" type="button">Encerrar</button>
      </div>
    </section>

    <section class="preset-panel" aria-labelledby="preset-title">
      <div class="section-line">
        <h2 id="preset-title">Temporizadores</h2>
        <button class="text-button" id="open-dialog" type="button">Novo</button>
      </div>
      <div class="preset-list" id="preset-list"></div>
      <p class="empty-state" id="empty-state" hidden>Nenhum temporizador salvo. Crie um para começar.</p>
    </section>
  </main>

  <dialog class="timer-dialog" id="timer-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="timer-form">
      <div class="dialog-heading">
        <p class="eyebrow">configuração local</p>
        <h2 id="dialog-title">Novo temporizador</h2>
      </div>

      <label for="timer-input-name">Nome</label>
      <input id="timer-input-name" name="name" type="text" maxlength="30" autocomplete="off" required>

      <label for="timer-input-minutes">Minutos</label>
      <input id="timer-input-minutes" name="minutes" type="number" min="1" max="999" inputmode="numeric" required>

      <p class="form-error" id="form-error" role="alert"></p>

      <div class="dialog-actions">
        <button class="control secondary" value="cancel" type="button" id="cancel-dialog">Cancelar</button>
        <button class="control primary" value="default" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/timer-engine.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
